# Adopted 2026-09-10. Serves the PUBLISHED DISTRIBUTION instead of the source clone.
#
# Why, measured rather than supposed: the source clone wedges under the traces family
# with tracing on (#1720, divergence 4), which cost this lane sixteen tests every
# morning -- nine red and seven skipped -- through a wrapper exception that forced
# LANGFLOW_DEACTIVATE_TRACING=true. On 2026-09-10 the published distribution served
# the same family with tracing ON (23 of 23) and then the whole suite with it: 654
# tests, 3 failures, zero gunicorn WORKER TIMEOUT in 70 minutes.
#
# The replacement wrapper resolves the day's version the same way the run does -- by
# the published image -- installs that exact version, and REFUSES to run if it cannot,
# so the version gate stays enforced instead of being switched off.
#
# Rollback: delete this file and `systemctl daemon-reload`. /root/run-daily.sh is
# untouched beside it.
[Service]
ExecStart=
ExecStart=/root/run-daily-dist.sh
