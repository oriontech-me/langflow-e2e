name: Manual E2E Run

on:
  workflow_dispatch:
    inputs:
      langflow_target:
        description: |
          Langflow target. Options:
            • Docker tag: "latest", "1.5.1.dev36" (uses the image selected below)
            • Full URL of a running instance: "https://staging.example.com"
        required: true
        default: "latest"
      langflow_image:
        description: "Docker image to use: nightly (langflow-nightly) or stable (langflow)"
        required: false
        type: choice
        options:
          - nightly
          - stable
        default: "nightly"
      test_tag:
        description: |
          Playwright tag to run. Empty = every test. Common tags:
            @stable @release @regression @api @components @workspace
            @agents @mcp @playground @auth @model-provider @files @ui-ux
        required: false
        default: ""
      test_grep:
        description: "Additional name/regex filter, ANDed with the tag above (e.g. 'login|logout')"
        required: false
        default: ""
      provider:
        description: |
          Which provider(s) the parametrized LLM specs run against (#1186). This is
          the ONLY lane that can still run multi-provider: pr-validation pins openai
          (#1169) and daily-stable rotates one provider per weekday (#1185).
            • auto       — one model per active provider (multi-provider, unchanged)
            • openai / anthropic / google — pin to that provider's SETTLED model
            • all-models — every model in the catalog (deliberate, expensive sweep;
              NARROW it with test_tag/test_grep — ~30 parametrized agent tests over a
              90-model catalog does not finish inside this job's 90-minute timeout)
          Docker targets only: the external-URL job rejects anything but "auto"
          (it runs no collect-models and receives no provider key).
        required: false
        type: choice
        options:
          - auto
          - openai
          - anthropic
          - google
          - all-models
        default: "auto"
      any_completion_provider:
        description: |
          Where the `any-completion` tier runs (#1187). "ollama" routes those specs
          to this job's Ollama service — no key, no quota, no credit — and overrides
          any model pin, for that tier only. "hosted" keeps them on a keyed provider.
        required: false
        type: choice
        options:
          - hosted
          - ollama
        default: "hosted"
      retries:
        description: |
          Playwright retries for the run. Empty = the config default (2 in CI).
          Set "0" to measure a spec honestly — a retry hides an intermittent
          failure, which is what any measurement dispatched here is looking for.
          Honoured by BOTH target kinds (Docker and external URL).

          NOT "passes 3/3" any more, which this input used to name as the #1187
          adoption gate. Measured: the pilot passes ~60 % (9/15) and a three-run
          gate certifies that with probability 0.6³ ≈ 22 % — which is exactly how
          it was adopted. Dispatch a stated N, record the RATE, and read a spec
          that is not ~100 % as ineligible for the tier.
        required: false
        default: ""

jobs:
  detect-target:
    runs-on: ubuntu-latest
    outputs:
      use_docker: ${{ steps.check.outputs.use_docker }}
      base_url: ${{ steps.check.outputs.base_url }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      docker_image: ${{ steps.check.outputs.docker_image }}
    steps:
      # A retry count the config cannot read is worse than no input at all: the
      # dispatcher asked to measure a spec unamplified, and `Number("O")` is `NaN`,
      # which Playwright resolves to its own default — the run would then hide the
      # very intermittency the #1187 gate exists to expose, and say nothing. Both
      # target jobs read this input, so the check belongs here, before either runs.
      - name: Validate the retries input
        if: github.event.inputs.retries != ''
        env:
          RETRIES: ${{ github.event.inputs.retries }}
        run: |
          case "$RETRIES" in
            ''|*[!0-9]*)
              echo "::error::retries=\"$RETRIES\" is not a non-negative integer. \
          Leave it empty for the config default (2 in CI), or pass a number \
          (\"0\" for the #1187 adoption gate)."
              exit 1
              ;;
          esac
          echo "retries=$RETRIES"

      - id: check
        run: |
          TARGET="${{ github.event.inputs.langflow_target }}"
          IMAGE_TYPE="${{ github.event.inputs.langflow_image || 'nightly' }}"
          if [ "$IMAGE_TYPE" = "nightly" ]; then
            REPO="langflowai/langflow-nightly"
          else
            REPO="langflowai/langflow"
          fi
          if [[ "$TARGET" == http* ]]; then
            echo "use_docker=false" >> $GITHUB_OUTPUT
            echo "base_url=$TARGET" >> $GITHUB_OUTPUT
            echo "image_tag=" >> $GITHUB_OUTPUT
            echo "docker_image=" >> $GITHUB_OUTPUT
          else
            echo "use_docker=true" >> $GITHUB_OUTPUT
            echo "base_url=http://localhost:7860/" >> $GITHUB_OUTPUT
            echo "image_tag=$TARGET" >> $GITHUB_OUTPUT
            echo "docker_image=${REPO}:${TARGET}" >> $GITHUB_OUTPUT
          fi

  e2e-docker:
    name: E2E via Docker (${{ github.event.inputs.langflow_target }})
    needs: detect-target
    if: needs.detect-target.outputs.use_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      langflow:
        image: ${{ needs.detect-target.outputs.docker_image }}
        ports:
          - 7860:7860
        env:
          LANGFLOW_AUTO_LOGIN: "true"
          LANGFLOW_SUPERUSER: langflow
          LANGFLOW_SUPERUSER_PASSWORD: langflow123
          # Nightly image defaults LANGFLOW_ALLOW_CUSTOM_COMPONENTS=false
          # (custom-component creation disabled → sidebar button hidden, API
          # 403). Enable it so the custom-component specs exercise the feature.
          LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "true"
          # A2A is off by default (lfx `a2a_enabled=False`) and its router is ALWAYS
          # mounted, so with the flag off the three /api/v1/a2a/* routes answer 404 —
          # indistinguishable from "not mounted". Enable it so the
          # core-functionality/a2a specs exercise the surface instead of asserting
          # against a disabled one, which would pass while testing nothing (#1240;
          # surface scoped in #1195).
          LANGFLOW_A2A_ENABLED: "true"
          # Keep tracing ON: the observability/traces specs probe
          # /api/v1/monitor/traces, populated by the internal native tracer whose
          # worker never starts when tracing is deactivated — disabling it makes
          # those specs fail deterministically (see #352). Matches daily/weekly.
          LANGFLOW_DEACTIVATE_TRACING: "false"
          # Ollama runs as a sibling service; without the allowlist the
          # nightly's SSRF protection 400s the component's model-list fetch
          # (private address) — see ollama-provider.spec.ts / its spec doc.
          # The CIDRs cover the go-httpbin service below, reached by raw container
          # IP because validators.url() rejects a single-label host (#462/#1128).
          LANGFLOW_SSRF_ALLOWED_HOSTS: "ollama,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
        options: >-
          --health-cmd "curl -f http://localhost:7860/health_check || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s
      # Local Ollama instance for ollama-provider.spec.ts (§7.6), with the
      # test model BAKED into the image (built by build-ollama-image.yml —
      # no per-run model pull, no registry.ollama.ai dependency). The tests
      # skip with a reason when the service is absent.
      ollama:
        image: ghcr.io/${{ github.repository }}/ollama-e2e:llama3.2-1b
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
      # Self-hosted echo endpoint for the API Request and agent-fetch-tool specs
      # (#1128). Only THIS job gets one: the `external URL` job below points at a
      # Langflow that is not on this runner's Docker network, so it could never
      # reach a service container here — that job keeps the public default, and
      # the reason is recorded on it.
      # Tag has NO `v` prefix (#639); no healthcheck (scratch image, no shell).
      go-httpbin:
        image: ghcr.io/mccutchen/go-httpbin:2.23.1
        ports:
          - 8080:8080

    # Reaches the services two ways: the test host uses the mapped port
    # (localhost), Langflow uses the job network's service hostname.
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_BASE_URL_FROM_LANGFLOW: http://ollama:11434
      OLLAMA_TEST_MODEL: llama3.2:1b
      # Set at JOB level, not on the run step: `.github/actions/run-e2e` declares
      # its own `env:` per step, and a step-level block ADDS to the job environment
      # rather than replacing it — which is already how the three OLLAMA_* vars
      # above reach the Playwright process. So routing needs no change to the
      # shared action, and no other lane's behaviour moves.
      #
      # This is the lane that can answer #1187's adoption gate: it has the Ollama
      # service with the model baked into the image, and `retries` lets a dispatch
      # measure a candidate spec with retries off.
      # "hosted" maps to EMPTY, which is what `resolveTestTargets` reads as "not
      # routed" — the choice is worded for the dispatcher, the variable for the code.
      ANY_COMPLETION_PROVIDER: >-
        ${{ github.event.inputs.any_completion_provider == 'ollama' && 'ollama' || '' }}
      PLAYWRIGHT_RETRIES: ${{ github.event.inputs.retries }}
      # Azure AI Foundry (§7.8, #1194 → #1270). At JOB level for the reason spelled
      # out above the OLLAMA_* block: `.github/actions/run-e2e` declares per-step
      # `env`, which ADDS to the job environment rather than replacing it, so the
      # shared action needs no new inputs and no other lane moves.
      #
      # This lane is where a dispatch can PROVE the wiring: with the three secrets
      # present the spec's two credential tests execute; without them they skip
      # naming which variable is missing, and a wrong value skips naming the
      # resource's answer instead — the probe distinguishes the two.
      #
      # Scoped to the Docker job on purpose. The external-URL job below runs no
      # `collect-models` because writing our provider credentials as global
      # variables into an instance we do not own is not ours to do (#1055), and
      # these two tests STORE the credential pair in the target Langflow — the same
      # rule, so it is not wired there.
      AZURE_AI_FOUNDRY_API_KEY: ${{ secrets.AZURE_AI_FOUNDRY_API_KEY }}
      AZURE_AI_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_AI_FOUNDRY_ENDPOINT }}
      AZURE_AI_FOUNDRY_TEST_DEPLOYMENT: ${{ secrets.AZURE_AI_FOUNDRY_TEST_DEPLOYMENT }}
      # The token sidecar's bounds, at JOB level because TWO steps read them: the
      # poller below and the test step of the `run-e2e` composite, where the attribution sidecar runs inside
      # `deleteFlow`'s teardown hook. They used to live in the poller step's own
      # `env:`, which does not cross into another step -- so the sidecar never saw
      # either one and silently used its hard-coded defaults. The numbers happened
      # to match, so nothing was wrong in the run and nothing could be seen in a
      # diff; the only symptom was a knob that did not turn, precisely when a
      # wedged monitor endpoint made someone want to turn it.
      #
      # Defined ONCE, here, so the poller and the sidecar cannot end up bounded by
      # different numbers. Pinned by scripts/token-sidecar-knobs.test.mjs.
      TOKENS_TIMEOUT_MS: "8000"
      TOKENS_DETAIL_CAP: "25"
      # Per-CALL wall-clock ceiling for the attribution sidecar. Wired AHEAD of its
      # reader on purpose: the budget itself lands with #1217's `deleteFlow` hook,
      # and adding it from that PR would mean touching pr-validation.yml from a
      # spec change, which flips that lane's coverage verdict to `canary` and drops
      # its impacted-spec run. An unread variable costs nothing; a lane that cannot
      # turn the knob when a monitor endpoint wedges costs a shard. With the two
      # above it bounds a call at budget + timeout = 23s instead of
      # cap x timeout = 208s. Read by the sidecar only; the poller has its own
      # TOKENS_MAX_SECONDS.
      TOKENS_BUDGET_MS: "15000"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
      # Point the echo-dependent specs at the sibling go-httpbin service (#1128).
      # `mode: fail`: a manual run exists to answer a specific question, and
      # answering it against a public host that may be down wastes the dispatch.
      - name: Resolve echo endpoint
        uses: ./.github/actions/resolve-echo-endpoint
        with:
          mode: fail
          in_container: "false"
      - name: Confirm the baked Ollama model is served
        run: |
          # The model ships inside the image — cheap readiness/sanity check,
          # not a pull.
          curl -sf --retry 10 --retry-delay 3 --retry-connrefused \
            "$OLLAMA_BASE_URL/api/tags" | grep -q "$OLLAMA_TEST_MODEL" \
            && echo "model $OLLAMA_TEST_MODEL ready"

      # Import the provider credentials into THIS run's Langflow container, the
      # same way daily-stable.yml and pr-validation.yml do (#1055).
      #
      # Without it every dispatch died before the first test: the run below
      # passes OPENAI_API_KEY, and the #884 pre-flight hard-fails in CI on a key
      # that is present in the environment but absent from Langflow's global
      # variables — which is exactly the state a container that never ran
      # collect-models is in. The gate landed 2026-07-22 (#885) and this
      # workflow's last dispatch before the bug surfaced was 2026-07-08, so no
      # one had run it since.
      #
      # Dropping the key instead would NOT have been equivalent: the provider
      # health gate fails OPEN when providers.json is absent
      # (`readProviderHealth` → null, #1029), so the provider-hardcoded specs
      # would run against a credential-less Langflow and fail with the
      # misleading node_duration errors #884 exists to remove.
      #
      # Same three guards the other two workflows carry:
      #  - PREFLIGHT_SKIP_CREDENTIALS: this run is what IMPORTS the keys, so the
      #    pre-flight must not assert them first (chicken-and-egg);
      #  - PLAYWRIGHT_RETRIES=0: a failing sweep must not re-walk the Model
      #    Providers UI three times against a single backend (#1011);
      #  - continue-on-error: a drained key must not kill the specs that never
      #    touch that provider (#980).
      - name: Collect models
        id: collect_models
        continue-on-error: true
        run: npx playwright test tests/collect-models.spec.ts --reporter=line
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ needs.detect-target.outputs.base_url }}
          PLAYWRIGHT_RETRIES: "0"
          PREFLIGHT_SKIP_CREDENTIALS: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      # The sweep above can leave the shared backend WEDGED — container alive,
      # event loop blocked, requests unanswered (#922/#927). globalSetup polls
      # 120 s and then throws, reporting a preflight error that names nothing, so
      # wait it out here and, when it does not clear, fail with the real cause.
      # Short per-request timeout over a long deadline (#928): a hung request must
      # fail fast so the loop keeps polling across the wedge.
      #
      # Shared implementation since #1045 (`.github/actions/wait-for-backend`),
      # which is what this step's own comment asked for while it was the fourth
      # inline copy. The deadline this lane measured is now the shared default: its
      # validation dispatch (run 30422284968) took 260 s to clear — 87% of the
      # 300 s the daily used to allow.
      #
      # `base_url` matters HERE and nowhere else: this workflow can target a
      # Langflow that is not the job's service container (an external URL input),
      # so the gate must probe whatever `detect-target` resolved.
      - name: Wait for the backend to recover from the collect-models load
        uses: ./.github/actions/wait-for-backend
        with:
          base_url: ${{ needs.detect-target.outputs.base_url }}
          next_step_label: "the run"
          attribution: "NOT a failure of the tests you dispatched"
          collect_models_outcome: ${{ steps.collect_models.outcome }}

      # Resolve the `provider` input into the variables the parametrized specs read
      # (#1186). This lane is the escape hatch for multi-provider coverage: since
      # 2026-07-31 `pr-validation.yml` pins openai (#1169) and `daily-stable.yml`
      # rotates one provider per weekday (#1185), so no lane runs multi-provider by
      # default any more and there was no input to ask for one.
      #
      # The rotation bounds the detection window for a provider-specific regression,
      # but the schedule is Mon-Fri, so the real per-provider latency is ≤4 days for
      # openai and anthropic and SEVEN days for google (Wednesday's only slot) — and
      # google is the provider of #963. This step is how that gap gets closed on
      # demand.
      #
      # Placed between the health gate and the run, mirroring the other two lanes: it
      # is worthless before `Collect models` has written providers.json, and useless
      # after the run it configures. A structural test fails if it moves.
      #
      # NO continue-on-error, unlike the daily's rotation step — a deliberate
      # difference. There the pin is an optimisation the lane applies to itself, so a
      # failure should cost spend rather than the day's coverage (#980). Here the input
      # IS the request: continuing after a failed `anthropic` pin would run the other
      # providers, answer a different question and report success, which is the shape
      # #1012 forbids. This lane is never scheduled, so failing costs a re-dispatch.
      #
      # `auto` (the default) emits nothing, and no state of providers.json/models.json
      # can fail it — that is what makes "unchanged behaviour" a property rather than a
      # promise. It is not silent, though: an absent or empty catalog collapses the
      # default fan-out to ONE "provider:openai (fallback)" target with no skip reason
      # (openai's key is forwarded here, so nothing skips to make that visible), and
      # `Collect models` above is continue-on-error. `auto` warns in that state rather
      # than letting a release-gate dispatch report multi-provider coverage it did not
      # have — the fan-out it prints is derived from BOTH files, so the log cannot claim
      # a sweep the run will not do. Both halves are needed: the resolver takes its
      # targets from models.json and its skips from providers.json, and those disagree by
      # construction (collect-models scrapes the model lists before it validates the
      # keys), so a drained provider stays in the catalog and yields a target that
      # test.skip()s. The count is over the RUNNABLE targets for that reason.
      - name: Resolve the run's provider selection
        run: |
          node scripts/select-manual-model-target.mjs --selection "$SELECTION"
        env:
          # Through the environment, never interpolated into the script body — same
          # rule the `run-e2e` action states for its own inputs.
          SELECTION: ${{ github.event.inputs.provider }}

      # In-run token consumption recorder, extended to this job (#1183 — measure
      # the suite's real LLM spend per lane/provider). Same mechanism as
      # daily-stable.yml / pr-validation.yml (#1197): poll
      # /api/v1/monitor/traces and price what each trace spent, because
      # deleting a flow 404s its trace and this suite deletes every flow it
      # creates, so the only place to read the data is DURING the run.
      #
      # Only wired into THIS job. It polls TOKENS_BASE_URL, which defaults to
      # localhost — exactly this job's Langflow service container. The
      # `e2e-url` job below targets an EXTERNAL Langflow instance the runner
      # does not host; a recorder started there would poll a localhost with
      # nothing behind it and spend the whole run logging connection-refused
      # errors, never producing a real number — worse than not measuring, so
      # it is deliberately skipped there instead of started to fail.
      #
      # MEASUREMENT-ONLY: --summarize (below, after the run) still renders a
      # step-summary table, but TOKENS_SUPPRESS_HISTORY keeps it from writing
      # reports/token-history.jsonl — that file is the daily's series, one line
      # per FULL @stable sweep, and a manual dispatch's scope (whatever
      # tag/grep was chosen — @stable, a single spec, the whole suite) is
      # arbitrary and not comparable to it. Mixing the two would corrupt the
      # trend and the anomaly baseline the daily itself relies on (see the
      # summarizer's own comment on the knob).
      #
      # DIAGNOSTIC ONLY: continue-on-error, and it never gates the run.
      - name: Start the token consumption recorder
        shell: bash
        continue-on-error: true
        run: |
          nohup node scripts/watch-tokens.mjs > /tmp/tokens.log 2>&1 &
          echo "$!" > /tmp/tokens.pid
          disown
          echo "Token recorder started (pid $(cat /tmp/tokens.pid))."
        env:
          TOKENS_BASE_URL: http://localhost:7860
          TOKENS_OUT: token-probes.jsonl
          TOKENS_INTERVAL_MS: "15000"
          # TOKENS_TIMEOUT_MS and TOKENS_DETAIL_CAP are deliberately NOT here: they
          # are defined once at job level, because the attribution sidecar in the
          # test step reads them too and a step-level env: does not reach it.
          # Below the job's timeout-minutes: 90 so this is a real backstop, not
          # dead configuration reached only after the runner already killed the
          # job. Same reasoning as the daily's TOKENS_MAX_SECONDS.
          TOKENS_MAX_SECONDS: "5100"

      # Export TOKENS_ATTRIB for the specs' cleanup sidecar (#1183), same as
      # daily-stable.yml / pr-validation.yml — with it unset, the helper makes
      # no request and writes no file. The actual test run below is the
      # `run-e2e` COMPOSITE action, not a plain `run:` step: composite actions
      # do NOT inherit a caller step's `env:` block into their own internal
      # steps, so an `env:` added to the `uses:` line below would silently not
      # reach it. $GITHUB_ENV is not a fallback for that gap, it is the one
      # mechanism that actually works here — anything appended to it becomes a
      # real process environment variable for every later step in the job,
      # composite-internal steps included.
      #
      # continue-on-error: true, like every other step this change adds. The
      # step below it (`Run tests and upload report`) carries no `if:` of its
      # own, so a failure here — however unlikely for a bare `echo` — would
      # otherwise skip the run it exists only to measure: a diagnostic add-on
      # aborting the work it measures, which this whole change is built to
      # never do.
      - name: Export TOKENS_ATTRIB for the specs' cleanup sidecar
        continue-on-error: true
        run: echo "TOKENS_ATTRIB=token-attrib.jsonl" >> "$GITHUB_ENV"

      - name: Run tests and upload report
        uses: ./.github/actions/run-e2e
        with:
          base_url: ${{ needs.detect-target.outputs.base_url }}
          test_tag: ${{ github.event.inputs.test_tag }}
          test_grep: ${{ github.event.inputs.test_grep }}
          # The same three keys the `Collect models` step above imported into this
          # container. Passing only OpenAI made every anthropic/google-parameterized
          # spec skip on `hasProviderEnvKeys`, so a dispatch could report success
          # having run none of the specs it was aimed at (#967).
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          google_api_key: ${{ secrets.GOOGLE_API_KEY }}

      # Stop the recorder, price what it saw, and upload the raw JSONL — mirrors
      # daily-stable.yml's shard-level "Stop and collect" + merge-job
      # "Summarize" steps, collapsed into one job since this workflow has no
      # shards to merge. always(): the recorder's data is most useful precisely
      # when the run went red, and continue-on-error on every step here means a
      # defect in the reporting itself can never touch the specs' own pass/fail.
      - name: Stop and collect token consumption
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # SIGTERM is the recorder's normal exit path: it stops after the
          # current probe.
          if [ -f /tmp/tokens.pid ]; then
            kill "$(cat /tmp/tokens.pid)" 2>/dev/null || true
          fi
          # Let an in-flight append land before the file is copied — same
          # reasoning and margin as the daily's own copy of this step.
          sleep 10
          mkdir -p tokens
          cp token-probes.jsonl tokens/ 2>/dev/null || true
          cp token-attrib.jsonl tokens/ 2>/dev/null || true
          echo "--- token recorder stdout (tail) ---"
          tail -n 5 /tmp/tokens.log 2>/dev/null || true

      - name: Summarize token consumption
        if: always()
        continue-on-error: true
        run: node scripts/watch-tokens.mjs --summarize
        env:
          TOKENS_DIR: tokens
          TOKENS_PRICES: scripts/lib/model-prices.json
          WORKFLOW: manual
          LANGFLOW_IMAGE: ${{ needs.detect-target.outputs.docker_image }}
          # Measurement-only lane (#1183): never add a line to
          # reports/token-history.jsonl. See "Start the token consumption
          # recorder" above and the summarizer's own comment on this knob for
          # why an arbitrary manual-dispatch scope is not comparable to the
          # daily's series. Suppressed openly, not silently: the summarizer
          # states this in both its log line and the step summary itself
          # (#1012's rule).
          TOKENS_SUPPRESS_HISTORY: "1"

      - name: Upload token consumption
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: tokens-manual-${{ github.run_id }}
          path: tokens/
          if-no-files-found: ignore

  # Scoped OUT of the go-httpbin decoupling (#1128), deliberately: this job points
  # at a Langflow we do not host — a staging deployment, someone's tunnel — which
  # is not on this runner's Docker network and therefore cannot reach a service
  # container here. The echo-dependent specs consequently still call the public
  # host in this job and remain exposed to its outages. Self-hosting for it would
  # need a publicly reachable echo, which is a different (and larger) decision
  # than the one #1128 asked for.
  #
  # Also scoped OUT of the token consumption recorder (#1183), for the same
  # class of reason: TOKENS_BASE_URL defaults to localhost, which is
  # `e2e-docker`'s own Langflow service container, not the external instance
  # this job targets. Starting the recorder here would poll a localhost with
  # nothing listening behind it and spend the whole run logging
  # connection-refused errors instead of measuring anything real — so it is
  # skipped rather than started to fail.
  e2e-url:
    name: E2E via URL (${{ github.event.inputs.langflow_target }})
    needs: detect-target
    if: needs.detect-target.outputs.use_docker == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # `retries` is a dispatch input, not a Docker-lane input, so it is honoured on
    # BOTH target kinds — set at job level for the same reason as in `e2e-docker`
    # (`.github/actions/run-e2e` declares per-step `env`, which ADDS to the job
    # environment rather than replacing it). Routing is the one input this job
    # cannot honour, and it says so out loud in the first step below; `retries`
    # has no such obstacle, and leaving it unset here would have been the silent
    # half of the same failure — a dispatcher passing "0" to measure a spec would
    # have got the config default and no indication of it.
    env:
      PLAYWRIGHT_RETRIES: ${{ github.event.inputs.retries }}

    steps:
      # Say NO out loud rather than running something else (#1012). This job targets
      # a Langflow that is not on this runner's network, so it cannot reach the
      # Ollama service container — the same reason it is scoped out of the go-httpbin
      # decoupling above. Ignoring the input would run the routed specs against a
      # HOSTED provider while the dispatch summary said `ollama`: the run would be
      # green, spend keys, and prove nothing about the local path.
      - name: Reject local-model routing on an external target
        if: github.event.inputs.any_completion_provider == 'ollama'
        run: |
          echo "::error::any_completion_provider=ollama cannot be honoured against \
          an external Langflow: this job has no Ollama service container, and the \
          target is not on this runner's network. Dispatch with a Docker tag to \
          route the any-completion tier locally (#1187)."
          exit 1

      # Reject, rather than decline with a warning (#1186's open decision, decided).
      # This job runs NO `collect-models` — deliberately, since that would write our CI
      # provider keys as global variables into an instance we do not own (#1055) — and
      # receives no provider key at all, so `hasProviderEnvKeys()` already makes every
      # parametrized LLM spec skip here regardless of the input (#967). Honouring
      # `provider` would therefore produce a GREEN run that executed none of the specs
      # the input aimed at: the silent all-skip this issue's own acceptance criteria
      # forbid (#570 / #1012). There is also nothing to pin TO — providers.json is
      # never written on this path, so no settled model exists.
      #
      # Empty is accepted alongside `auto`: a dispatch queued before this input existed
      # sends no value, and failing it would break a re-run of an older dispatch.
      - name: Reject a provider selection on an external target
        if: >-
          github.event.inputs.provider != '' &&
          github.event.inputs.provider != 'auto'
        env:
          SELECTION: ${{ github.event.inputs.provider }}
        run: |
          echo "::error::provider=\"$SELECTION\" cannot be honoured against an \
          external Langflow: this job runs no collect-models (it must not write our \
          keys into an instance we do not own) and receives no provider key, so there \
          is no settled model to pin to and every parametrized LLM spec skips here \
          anyway. Dispatch with a Docker tag to select a provider, or leave it on \
          \"auto\" for this target (#1186)."
          exit 1

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright

      # No provider key inputs at all, and no `collect-models` — deliberately
      # different from the Docker job (#1055).
      #
      # This job targets an instance that already exists and that we do not own:
      # a staging deployment, someone's tunnel. `collect-models` would WRITE our
      # CI provider keys into that instance as global variables, which is not a
      # side effect a test dispatch may have on a shared environment. Passing the
      # key WITHOUT importing it is what broke this workflow in the first place —
      # the #884 pre-flight hard-fails on a key present in the environment but
      # absent from Langflow.
      #
      # So the target's OWN credentials govern. With no provider key in the
      # environment the pre-flight has nothing to assert and skips the check, and
      # the provider specs exercise whatever that instance is actually configured
      # with — the honest thing to test against a deployment we do not control.
      - name: Run tests and upload report
        uses: ./.github/actions/run-e2e
        with:
          base_url: ${{ needs.detect-target.outputs.base_url }}
          test_tag: ${{ github.event.inputs.test_tag }}
          test_grep: ${{ github.event.inputs.test_grep }}
