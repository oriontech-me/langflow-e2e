name: Manual E2E Run

on:
  workflow_dispatch:
    inputs:
      langflow_target:
        description: |
          Langflow target. Options:
            • Docker tag: "latest", "1.5.1.dev36" (uses the image selected below)
            • Full URL of a running instance: "https://staging.example.com"
        required: true
        default: "latest"
      langflow_image:
        description: "Docker image to use: nightly (langflow-nightly) or stable (langflow)"
        required: false
        type: choice
        options:
          - nightly
          - stable
        default: "nightly"
      test_tag:
        description: |
          Playwright tag to run. Empty = every test. Common tags:
            @stable @release @regression @api @components @workspace
            @agents @mcp @playground @auth @model-provider @files @ui-ux
        required: false
        default: ""
      test_grep:
        description: "Additional name/regex filter, ANDed with the tag above (e.g. 'login|logout')"
        required: false
        default: ""

jobs:
  detect-target:
    runs-on: ubuntu-latest
    outputs:
      use_docker: ${{ steps.check.outputs.use_docker }}
      base_url: ${{ steps.check.outputs.base_url }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      docker_image: ${{ steps.check.outputs.docker_image }}
    steps:
      - id: check
        run: |
          TARGET="${{ github.event.inputs.langflow_target }}"
          IMAGE_TYPE="${{ github.event.inputs.langflow_image || 'nightly' }}"
          if [ "$IMAGE_TYPE" = "nightly" ]; then
            REPO="langflowai/langflow-nightly"
          else
            REPO="langflowai/langflow"
          fi
          if [[ "$TARGET" == http* ]]; then
            echo "use_docker=false" >> $GITHUB_OUTPUT
            echo "base_url=$TARGET" >> $GITHUB_OUTPUT
            echo "image_tag=" >> $GITHUB_OUTPUT
            echo "docker_image=" >> $GITHUB_OUTPUT
          else
            echo "use_docker=true" >> $GITHUB_OUTPUT
            echo "base_url=http://localhost:7860/" >> $GITHUB_OUTPUT
            echo "image_tag=$TARGET" >> $GITHUB_OUTPUT
            echo "docker_image=${REPO}:${TARGET}" >> $GITHUB_OUTPUT
          fi

  e2e-docker:
    name: E2E via Docker (${{ github.event.inputs.langflow_target }})
    needs: detect-target
    if: needs.detect-target.outputs.use_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      langflow:
        image: ${{ needs.detect-target.outputs.docker_image }}
        ports:
          - 7860:7860
        env:
          LANGFLOW_AUTO_LOGIN: "true"
          LANGFLOW_SUPERUSER: langflow
          LANGFLOW_SUPERUSER_PASSWORD: langflow
          # Keep tracing ON: the observability/traces specs probe
          # /api/v1/monitor/traces, populated by the internal native tracer whose
          # worker never starts when tracing is deactivated — disabling it makes
          # those specs fail deterministically (see #352). Matches daily/weekly.
          LANGFLOW_DEACTIVATE_TRACING: "false"
        options: >-
          --health-cmd "curl -f http://localhost:7860/health_check || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
      - name: Run tests and upload report
        uses: ./.github/actions/run-e2e
        with:
          base_url: ${{ needs.detect-target.outputs.base_url }}
          test_tag: ${{ github.event.inputs.test_tag }}
          test_grep: ${{ github.event.inputs.test_grep }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  e2e-url:
    name: E2E via URL (${{ github.event.inputs.langflow_target }})
    needs: detect-target
    if: needs.detect-target.outputs.use_docker == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
      - name: Run tests and upload report
        uses: ./.github/actions/run-e2e
        with:
          base_url: ${{ needs.detect-target.outputs.base_url }}
          test_tag: ${{ github.event.inputs.test_tag }}
          test_grep: ${{ github.event.inputs.test_grep }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
