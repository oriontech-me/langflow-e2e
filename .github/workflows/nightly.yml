name: Nightly E2E Regression

on:
  # schedule:
  #   - cron: "0 6 * * *" # 03:00 BRT (UTC-3)
  # Schedule disabled until the suite is stable in production.
  # To enable: uncomment the lines above.
  workflow_dispatch:
    inputs:
      langflow_image_tag:
        description: "Langflow nightly image tag (e.g. latest, 1.5.1.dev36)"
        required: false
        default: "latest"
      test_grep:
        description: "Filter tests by pattern (leave empty for all)"
        required: false
        default: ""

jobs:
  e2e-nightly:
    name: Nightly E2E (langflow-nightly:${{ github.event.inputs.langflow_image_tag || 'latest' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      langflow:
        image: langflowai/langflow-nightly:${{ github.event.inputs.langflow_image_tag || 'latest' }}
        ports:
          - 7860:7860
        env:
          LANGFLOW_AUTO_LOGIN: "true"
          LANGFLOW_SUPERUSER: langflow
          LANGFLOW_SUPERUSER_PASSWORD: langflow123
          # Nightly image defaults LANGFLOW_ALLOW_CUSTOM_COMPONENTS=false
          # (custom-component creation disabled → sidebar button hidden, API
          # 403). Enable it so the custom-component specs exercise the feature.
          LANGFLOW_ALLOW_CUSTOM_COMPONENTS: "true"
          # A2A is off by default (lfx `a2a_enabled=False`) and its router is ALWAYS
          # mounted, so with the flag off the three /api/v1/a2a/* routes answer 404 —
          # indistinguishable from "not mounted". Enable it so the
          # core-functionality/a2a specs exercise the surface instead of asserting
          # against a disabled one, which would pass while testing nothing (#1240;
          # surface scoped in #1195).
          LANGFLOW_A2A_ENABLED: "true"
          LANGFLOW_DEACTIVATE_TRACING: "true"
          # Ollama runs as a sibling service; without the allowlist the
          # nightly's SSRF protection 400s the Ollama component's model-list
          # fetch (private address) — see ollama-provider.spec.ts (#583).
          # The CIDRs cover the go-httpbin service below, reached by raw
          # container IP because validators.url() rejects a single-label host
          # (#462/#1128); the IP is per-run, so authorize the ranges.
          LANGFLOW_SSRF_ALLOWED_HOSTS: "ollama,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
        options: >-
          --health-cmd "curl -f http://localhost:7860/health_check || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 90s
      # Local Ollama for ollama-provider.spec.ts (§7.6), test model BAKED
      # into the image (build-ollama-image.yml) — no per-run model pull. The
      # tests skip with a reason if the service is absent/unreachable.
      ollama:
        image: ghcr.io/${{ github.repository }}/ollama-e2e:llama3.2-1b
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
      # Self-hosted echo endpoint for the API Request and agent-fetch-tool specs,
      # so this lane stops calling public httpbin.org / postman-echo.com and
      # stops reddening on their outages (#1128, earlier #383/#407/#462/#639).
      # Tag has NO `v` prefix (#639). No healthcheck: the scratch-based image
      # ships no shell, so the resolve step's poll is the healthcheck.
      go-httpbin:
        image: ghcr.io/mccutchen/go-httpbin:2.23.1
        ports:
          - 8080:8080

    # The job runs on the runner host: it reaches Ollama via the mapped port;
    # Langflow reaches it via the job network's service hostname.
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_BASE_URL_FROM_LANGFLOW: http://ollama:11434
      OLLAMA_TEST_MODEL: llama3.2:1b

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright

      # Point the echo-dependent specs at the sibling go-httpbin service (#1128).
      # `mode: fail` rather than the daily's `warn`: this lane's whole output is
      # "did the nightly build regress?", and answering that from public
      # httpbin.org means a third-party outage opens a regression issue against
      # Langflow. A named infra failure is the honest alternative.
      - name: Resolve echo endpoint
        uses: ./.github/actions/resolve-echo-endpoint
        with:
          mode: fail
          in_container: "false"

      - name: Run E2E tests
        run: |
          FILTER="$(node scripts/build-grep-filter.mjs --grep="$TEST_GREP")"
          if [ -n "$FILTER" ]; then
            npx playwright test --grep "$FILTER" --reporter=github
          else
            npx playwright test --reporter=github
          fi
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:7860/"
          # Through env, never interpolated into the script body — the rule
          # `.github/actions/run-e2e` states for its own inputs. As `${{ … }}` inside
          # `run:`, a dispatch value like `"; rm -rf` is substituted before bash parses
          # the line and breaks out of the string.
          TEST_GREP: ${{ github.event.inputs.test_grep }}

      # Destructive lane (#1010). `@destructive` tests mutate account-wide state
      # (deleting every project of the shared superuser), so playwright.config.ts
      # excludes them from the run above and pins this lane to workers=1. It runs
      # AFTER that run, and `--pass-with-no-tests` makes it a no-op when the
      # optional grep filter above selected nothing destructive.
      #
      # `--reporter=github` replaces the whole configured reporter list, so this
      # step writes no HTML and cannot clobber the main run's `playwright-report/`
      # — at the cost of the lane not reaching Flakiness.io. `--output` keeps its
      # traces/screenshots out of the main run's `test-results/` too. The GitHub
      # annotations are the lane's signal.
      - name: Run destructive lane
        if: always()
        run: |
          # @destructive, narrowed by the optional dispatch filter. Composed by the
          # script so an alternation in `test_grep` is ANDed as a unit — interpolated
          # inline it split the lookahead and ran a narrower lane (#1275).
          FILTER="$(node scripts/build-grep-filter.mjs --require=@destructive --grep="$TEST_GREP")"
          npx playwright test --grep "$FILTER" --pass-with-no-tests \
            --reporter=github --output=test-results-destructive
        env:
          CI: "true"
          PW_DESTRUCTIVE: "1"
          PLAYWRIGHT_BASE_URL: "http://localhost:7860/"
          TEST_GREP: ${{ github.event.inputs.test_grep }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-nightly-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-nightly-${{ github.run_id }}
          path: test-results/
          retention-days: 7

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const tag = '${{ github.event.inputs.langflow_image_tag || "latest" }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Nightly Failure] E2E tests failed on ${today} (langflow:${tag})`,
              body: [
                '## Nightly E2E Test Failure',
                '',
                `- **Date:** ${today}`,
                `- **Langflow version:** \`langflowai/langflow-nightly:${tag}\``,
                `- **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '### Next steps',
                '1. Check the Playwright report artifact in the run above',
                '2. Determine if the failure is a test bug or a Langflow regression',
                '3. Update or fix the affected tests',
                '',
                '/cc @Victor-w-Madeira',
              ].join('\n'),
              labels: ['nightly-failure', 'needs-triage'],
            });
