# Dependabot VERSION updates. Two things this file is NOT:
#
#  1. It is not what closes a Dependabot *alert*. Alerts are closed by Dependabot
#     **security updates**, a repository setting (Settings → Code security →
#     "Dependabot security updates") that cannot be enabled from this file and
#     needs admin on the repo. That distinction matters here because every alert
#     this repo has received (#1–#6) was a *transitive* dev dependency of eslint
#     (`picomatch`, `brace-expansion`) — nothing in package.json. Version updates
#     below sweep the dependencies we declare; the security-updates toggle is what
#     reacts to an advisory landing on something we only reach through the tree.
#     See issue #1202.
#
#  2. It is not a substitute for review. Grouped PRs land as one diff per
#     ecosystem, and the PR lane reports `skipping` on a manifest-only change
#     (nothing under tests/ imports a manifest, so the import graph honestly
#     returns zero specs). A green Dependabot PR therefore proves that the tree
#     resolves and the static gates pass — not that the suite still runs.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "Etc/UTC"
    # 12:00 UTC = 09:00 BRT, deliberately after daily-stable.yml's 05:00 BRT
    # window: a Dependabot PR triggers pr-validation.yml, which boots its own
    # Langflow service container, and the daily is the run that must not contend
    # for the runner.

    # Raised from 3 with the group's minor/patch limit below: the limit counts the
    # group PR PLUS every now-unbundled major, and majors are by construction the
    # slowest to merge, so they hold slots. Today that is already 3 (the group,
    # @types/node 26, dotenv 17) — at the old limit the next major would have been
    # suppressed, reintroducing this change's own failure mode (minors held up by a
    # major) through the limit instead of through the diff. Security-update PRs do
    # not count against it.
    open-pull-requests-limit: 6
    labels:
      - "infra"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

    groups:
      # One PR for all dev dependencies. Ungrouped, the six alerts this repo has
      # seen would have been six separate PRs, each booting a Langflow container
      # in the PR lane. There is exactly one production dependency (dotenv), so a
      # production group would be a group of one — it is left ungrouped on purpose.
      #
      # Minor and patch ONLY. A major does not belong in a group: the group is a
      # single diff that merges as a unit, so one unreviewable major takes every
      # reviewable minor down with it. PR #1204 is the measurement — six bumps,
      # two majors, and all three npm lanes died at `npm ci` before running a
      # single check, carrying four fine minors (eslint, eslint-plugin-playwright,
      # typescript-eslint, @types/node) with them. Excluded majors are not
      # blocked, they are UNBUNDLED: Dependabot proposes each one as its own PR,
      # where it can be reviewed — or rejected — on its own evidence.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

    ignore:
      # NOTE on everything in this list: `ignore` is one of the options that also
      # applies to Dependabot SECURITY updates, not just version updates (it carries
      # the shield icon in the options reference; `allow`'s `update-types` has an
      # explicit version-updates-only carve-out and `ignore` has no equivalent). So
      # an advisory whose fixed version falls inside an ignored range produces no PR
      # at all — the alert simply stays open. That is the cost of every entry here,
      # and the reason each is scoped as narrowly as its own evidence allows.
      #
      # @playwright/test and playwright are pinned to an EXACT version on purpose,
      # and the pin is load-bearing across files Dependabot cannot edit. Bumping
      # the runner means 8 coordinated edits across 3 files:
      #
      #   package.json          @playwright/test + playwright            (2)
      #   daily-stable.yml      3x `image: mcr.microsoft.com/playwright:vX-noble`
      #                         + 1x PLAYWRIGHT_VERSION env             (4)
      #   weekly-stable.yml     1x image tag + 1x PLAYWRIGHT_VERSION env (2)
      #
      # Dependabot only touches package.json and the lockfile, so its PR would
      # leave every workflow behind. daily-stable.yml then fails at its
      # "Verify Playwright version matches the container image" guard — while the
      # PR itself looks green, because a manifest change resolves to zero impacted
      # specs. A bot cannot make this change correctly; a human bumps the runner
      # and the image tags together.
      - dependency-name: "@playwright/test"
      - dependency-name: "playwright"

      # typescript >= 6, and scoped by version range rather than by
      # `update-types: semver-major` on purpose. TS 7 is the native (Go) port, and it
      # is not a version bump for this repo — it is three migrations at once, each
      # measured against 7.0.2 on #1204:
      #
      #   1. It has no JS compiler API (`ts.transpileModule` and `ts.createProgram`
      #      are `undefined`), so ts-node@10 throws on load. That is the
      #      `test:units` PR gate, `regressions:check`, `check:checklist-coverage`,
      #      `coverage:summary`, `regressions:summary`, `impacted`,
      #      `validate:specs` — and `update-coverage-summary.yml` on `main`, which
      #      is what keeps the QA-CHECKLIST generated blocks in sync.
      #   2. `tsconfig.json` stops compiling: `TS5108: Option
      #      'moduleResolution=node10' has been removed`.
      #   3. typescript-eslint 8.x peers `typescript >=4.8.4 <6.1.0`, so `npm ci`
      #      cannot even resolve the tree.
      #
      # Adopting TS 7 means replacing ts-node, rewriting moduleResolution against
      # the repo's imports, and waiting for typescript-eslint support. A bot cannot
      # do that — same reasoning as the @playwright/test pin above.
      #
      # TS 6 is none of those three things, and it was deliberately let through for a
      # reviewer to decide on — the right call, because blocking a major nobody has
      # evidence against is how a rationale rots into a rule. The reviewer decided
      # (PR #1390, closed; #1419): TS 6 is ADOPTABLE and not worth adopting yet. The
      # range therefore widened from `>=7` to `>=6`, and this is the evidence, since an
      # ignore whose justification is left implicit rots the same way a block does.
      #
      # This paragraph replaces a MEASUREMENT THAT WAS WRONG (#1228 recorded that the
      # `TS5107 moduleResolution=node10 is deprecated` error is "silenced by one
      # `ignoreDeprecations: "6.0"` line"). It is silenced for `tsc` only. Measured
      # against 6.0.3 with a real `npm ci`, three variants:
      #
      #                                                        tsc      ts-node
      #   `ignoreDeprecations: "6.0"` only                     pass     39 FAILURES
      #   `module` + `moduleResolution: node16`                pass     39 FAILURES
      #   `ignoreDeprecations: "6.0"` + `types: ["node"]`      pass     pass
      #
      # The ts-node column is `test:units`, and the same break takes
      # `check:checklist-coverage`, `regressions:check` and `coverage:summary` with it:
      # `TS2591 Cannot find name 'fs' / 'process' / '__filename'`. Under TS 6 ts-node
      # stops picking up `@types/node` automatically — isolated to `npx ts-node -e
      # 'import * as fs from "fs"'`, which fails without `types: ["node"]` and passes
      # with it. Note which variant is the dangerous one: the "correct"
      # `moduleResolution` migration leaves `tsc` green and ts-node dead, a state the
      # TypeScript job alone cannot see (the QA-CHECKLIST guard job catches it, because
      # it runs through ts-node).
      #
      # So the price is TWO tsconfig lines, not one — and with them everything passes
      # (tsc 0, `test:units` 552/552, `test:scripts` 796/796, the three ts-node gates
      # green, lint unchanged). What made it not worth paying: no language feature this
      # suite uses; `types: ["node"]` disables automatic `@types` inclusion, which is
      # harmless while `@types/node` is the only one and a silent trap the day a second
      # arrives; and `typescript-eslint@8.66` peers `typescript >=4.8.4 <6.1.0`, so
      # 6.1 breaks `npm ci` — the install, not the typecheck. Adopting 6.0.x buys a
      # major with no path forward until typescript-eslint 9.
      #
      # REVISIT when either half changes: a reason to want TS 6, or a typescript-eslint
      # release admitting 6.1+. Adopting it is then a deliberate PR carrying the two
      # tsconfig lines — never a merged bot PR, which cannot edit tsconfig.json and
      # would land red.
      - dependency-name: "typescript"
        versions:
          - ">=6"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "Etc/UTC"

    open-pull-requests-limit: 3
    labels:
      - "infra"
    commit-message:
      prefix: "ci(deps)"

    groups:
      # Grouped for the same reason as npm, plus one specific to this repo: the
      # action pins have already drifted apart because nothing sweeps them
      # (checkout @v7 vs @v4, upload-artifact @v7 vs @v4, setup-python @v6 vs @v5
      # — see #1202). A per-action PR stream is what let that happen unnoticed;
      # one grouped PR makes the whole set visible in a single diff.
      actions:
        patterns:
          - "*"
