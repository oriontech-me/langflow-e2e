name: "Run E2E tests"
description: >-
  Run the Playwright suite (optionally filtered by tag and/or name regex),
  produce a navigable HTML report, and upload it as an artifact. Shared by the
  two manual.yml jobs (Docker service vs. external URL) so the run/upload logic
  lives in one place. Assumes checkout + npm ci + Playwright browser install
  already ran in the calling job.

inputs:
  base_url:
    description: "PLAYWRIGHT_BASE_URL for the run (Docker service or external URL)."
    required: true
  test_tag:
    description: "Playwright tag to run (e.g. @stable, @release, @api). Empty = all tags."
    required: false
    default: ""
  test_grep:
    description: "Additional name/regex filter, ANDed with test_tag when both are set. Empty = no name filter."
    required: false
    default: ""
  openai_api_key:
    description: "OpenAI key for model-dependent specs (agents, playground). Optional."
    required: false
    default: ""
  anthropic_api_key:
    description: "Anthropic key for the anthropic-parameterized specs. Optional."
    required: false
    default: ""
  google_api_key:
    description: "Google key for the google-parameterized specs. Optional."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run tests
      shell: bash
      env:
        CI: "true"
        PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        # Inputs are passed through env (never interpolated into the script body)
        # so a value like "; rm -rf" cannot break out of the string — the shell
        # only ever sees them as variable contents.
        TEST_TAG: ${{ inputs.test_tag }}
        TEST_GREP: ${{ inputs.test_grep }}
        # Every provider key the caller supplied, not just OpenAI: a
        # provider-parameterized spec calls `hasProviderEnvKeys(<provider>)` and
        # skips itself when its own key is absent from the environment, so a
        # dispatch aimed at the anthropic or google specs silently ran zero of
        # them while collect-models reported the provider active (#967).
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
      run: |
        # Build the arg list as an array (no eval) so quoting is safe. Playwright only
        # honors one --grep, so "tag AND name" has to be composed into a single
        # lookahead chain — which this step used to do inline, interpolating each
        # fragment unparenthesised. A `test_grep` containing an alternation then split
        # the lookahead instead of being ANDed as a unit, and the lane ran a silently
        # narrower selection than the dispatch asked for (#1275: 48 of 81 tests, with
        # nothing in the log or the summary saying so). The composition lives in
        # `scripts/build-grep-filter.mjs` so `npm run test:scripts` covers it by
        # SELECTION rather than by a regex over this file's text (#1226).
        #
        # Empty output means no filter at all — never an empty --grep, which matches
        # every test and would turn a narrowed dispatch into a full-suite run.
        FILTER="$(node scripts/build-grep-filter.mjs --tag="$TEST_TAG" --grep="$TEST_GREP")"
        ARGS=(--pass-with-no-tests --reporter=html,github)
        if [ -n "$FILTER" ]; then ARGS+=(--grep "$FILTER"); fi
        echo "Running: npx playwright test ${ARGS[*]}"
        npx playwright test "${ARGS[@]}"

    # Destructive lane (#1010). `@destructive` tests mutate account-wide state, so
    # playwright.config.ts excludes them from the run above and pins this lane to
    # workers=1. It runs after that run, ANDed with whatever filters the dispatch
    # asked for, and no-ops when nothing destructive matches.
    - name: Run destructive lane
      if: always()
      shell: bash
      env:
        CI: "true"
        PW_DESTRUCTIVE: "1"
        PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        TEST_TAG: ${{ inputs.test_tag }}
        TEST_GREP: ${{ inputs.test_grep }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
      run: |
        # Same one-grep constraint as above, and the same composition — @destructive is
        # required, then narrowed by whatever the dispatch asked for. This lane had the
        # identical unparenthesised-interpolation bug (#1275); it never appears without
        # a required fragment, so it always goes through the composing path.
        FILTER="$(node scripts/build-grep-filter.mjs --require=@destructive \
          --tag="$TEST_TAG" --grep="$TEST_GREP")"
        # --reporter=github only: keeps this lane from overwriting the HTML report
        # the step above produced and the artifact below uploads.
        echo "Running destructive lane: --grep $FILTER"
        npx playwright test --pass-with-no-tests --reporter=github \
          --output=test-results-destructive --grep "$FILTER"

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-manual-${{ github.run_id }}
        path: playwright-report/
        retention-days: 14
